<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5C6EF8">
  <title>Makambu sin conexion</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1a1d2e;
      --muted: #5a5f7a;
      --accent: #5c6ef8;
      --warn: #f97316;
      --shadow: 0 10px 34px rgba(26, 29, 46, 0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(92,110,248,0.18), transparent 36%),
        linear-gradient(180deg, #eef1ff 0%, var(--bg) 42%);
      font-family: Arial, sans-serif;
      color: var(--text);
      padding: 24px;
    }

    .card {
      width: min(420px, 100%);
      background: var(--card);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
    }

    .icon {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: rgba(92,110,248,0.12);
      font-size: 34px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 26px;
      line-height: 1.1;
    }

    p {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 15px;
    }

    .warn {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(249,115,22,0.12);
      color: #9a3412;
      font-weight: 700;
      font-size: 14px;
    }

    .btn {
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 12px 18px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🎋</div>
    <h1>Makambu esta sin conexion</h1>
    <p>La aplicacion puede abrir su estructura basica, pero necesita internet para consultar Supabase y actualizar la informacion real de la familia.</p>
    <div class="warn">No tienes conexion. Makambu necesita internet para actualizar misiones, monedas y solicitudes.</div>
    <a class="btn" href="./#/hoy">Intentar de nuevo</a>
  </main>
</body>
</html>
